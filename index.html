<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alhira Foundation Nirmal | NEET Mock Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
      color: #14213d;
    }
    .container {
      max-width: 440px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h1, h2 { text-align: center; }
    h1 { color: #087443; font-size: 24px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd3df; }
    button {
      border: 0;
      color: white;
      background: #087443;
      font-weight: bold;
    }
    .secondary { background: #174ea6; }
    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 12px;
    }
    .note { font-size: 13px; color: #596579; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ALHIRA FOUNDATION</h1>
    <h2>Nirmal — NEET Mock Test</h2>
    <p style="text-align:center">Candidate Registration & Login</p>

    <form id="signupForm">
      <h3>Create Account</h3>
      <input id="fullName" placeholder="Full name" required>
      <input id="phone" placeholder="Mobile number" required>
      <input id="email" type="email" placeholder="Email address" required>
      <input id="pinCode" placeholder="PIN code">
      <input id="city" placeholder="City">
      <input id="address" placeholder="Full address">
      <select id="exam" style="width:100%;padding:12px;margin:7px 0">
        <option value="mini">Mini Mock — 45 Questions</option>
        <option value="full">Full Mock — 180 Questions</option>
      </select>
      <input id="groupCode" placeholder="Group code (optional)">
      <input id="signupPassword" type="password" minlength="8"
             placeholder="Create password (minimum 8 characters)" required>
      <button type="submit">Register</button>
    </form>

    <hr>

    <form id="loginForm">
      <h3>Already Registered? Login</h3>
      <input id="loginEmail" type="email" placeholder="Email address" required>
      <input id="loginPassword" type="password" placeholder="Password" required>
      <button type="submit" class="secondary">Login</button>
    </form>

    <button id="resetButton" class="secondary" type="button">
      Forgot Password
    </button>
    <button id="logoutButton" type="button">Logout</button>

    <p id="message" role="status"></p>
    <p class="note">
      If email confirmation is enabled, verify your email before logging in.
      Do not share your password with anyone.
    </p>
  </div>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://qhvwceihchvyreosxfgx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_7uEKxMDsDgiCBWgDvex6Fw_CQVSzb6i';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const message = document.getElementById('message');
    const showMessage = (text) => { message.textContent = text; };

    document.getElementById('signupForm').addEventListener('submit',
      async (event) => {
        event.preventDefault();
        showMessage('Registering...');

        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const pinCode = document.getElementById('pinCode').value.trim();
        const city = document.getElementById('city').value.trim();
        const address = document.getElementById('address').value.trim();
        const exam = document.getElementById('exam').value;
        const groupCode = document.getElementById('groupCode').value.trim();
        const password = document.getElementById('signupPassword').value;

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.origin +
              window.location.pathname,
            data: {
              full_name: fullName,
              phone,
              pin_code: pinCode,
              city,
              full_address: address,
              selected_exam: exam,
              group_code: groupCode
            }
          }
        });

        if (error) {
          showMessage('Registration failed: ' + error.message);
          return;
        }

        if (data.session) {
          showMessage('Account created! You are signed in.');
        } else {
          showMessage('Registration submitted! Check your email to confirm your account.');
        }
      }
    );

    document.getElementById('loginForm').addEventListener('submit',
      async (event) => {
        event.preventDefault();
        showMessage('Logging in...');

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        const { data, error } = await supabase.auth.signInWithPassword({
          email, password
        });

        if (error) {
          showMessage('Login failed: ' + error.message);
          return;
        }

        showMessage('Login successful! Welcome, ' +
          (data.user?.user_metadata?.full_name || email) + '.');
      }
    );

    document.getElementById('resetButton').addEventListener('click',
      async () => {
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) {
          showMessage('Enter your email in the Login section first.');
          return;
        }

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        });

        showMessage(error
          ? 'Password reset failed: ' + error.message
          : 'If the account exists, a password reset email will be sent.');
      }
    );

    document.getElementById('logoutButton').addEventListener('click',
      async () => {
        const { error } = await supabase.auth.signOut();
        showMessage(error ? error.message : 'Logged out successfully.');
      }
    );
  </script>
</body>
</html>
